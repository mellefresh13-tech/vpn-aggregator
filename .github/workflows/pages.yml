name: Deploy VPN catalog to Pages
on:
  # Catalog bot commits with GITHUB_TOKEN do not trigger push workflows.
  # Redeploy whenever the monitor finishes successfully.
  workflow_run:
    workflows:
      - "VPN catalog monitor"
    types:
      - completed
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    # Skip failed/cancelled monitor runs when triggered via workflow_run.
    if: >-
      github.event_name != 'workflow_run'
      || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # For workflow_run, check out the commit that finished the monitor.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
