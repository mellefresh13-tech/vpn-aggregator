name: Deploy VPN catalog to Pages
on:
  # Catalog bot commits with GITHUB_TOKEN do not trigger push workflows.
  # Redeploy whenever the monitor finishes successfully.
  workflow_run:
    workflows:
      - "VPN catalog monitor"
    types:
      - completed
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    # Skip failed/cancelled monitor runs when triggered via workflow_run.
    if: >-
      github.event_name != 'workflow_run'
      || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # IMPORTANT: do NOT use workflow_run.head_sha — that is the commit
      # the monitor *started* from, before it pushed the new docs/.
      # Always deploy the current tip of main (includes catalog bot commit).
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Show what we deploy
        run: |
          echo "Deploying commit: $(git rev-parse --short HEAD)"
          grep -o 'Updated[^<]*' docs/index.html | head -1 || true

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
