name: VPN catalog monitor
on:
  push:
    paths-ignore:
      - ".github/workflows/monitor.yml"
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
concurrency:
  group: vpn-catalog-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install OpenVPN
        run: |
          sudo apt-get update
          sudo apt-get install -y openvpn
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Update catalog
        env:
          VPNONLINE_USERNAME: ${{ secrets.VPNONLINE_USERNAME }}
          VPNONLINE_PASSWORD: ${{ secrets.VPNONLINE_PASSWORD }}
          PUBLICVPNLIST_API_KEY: ${{ secrets.PUBLICVPNLIST_API_KEY }}
        run: python scripts/update_catalog.py
      - name: Validate published files
        run: |
          python -m json.tool data/servers.json >/dev/null
          python -m json.tool data/history.json >/dev/null
      - name: Publish generated data
        run: |
          git config user.name "vpn-aggregator[bot]"
          git config user.email "vpn-aggregator[bot]@users.noreply.github.com"
          git add data/servers.json data/history.json docs
          if git diff --cached --quiet; then
            echo "No catalog changes to publish"
            exit 0
          fi
          git commit -m "chore: update VPN catalog"
          # Avoid race when another job pushed to main while this run was working.
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              echo "Published catalog on attempt $attempt"
              exit 0
            fi
            echo "Push rejected (attempt $attempt), retrying..."
            sleep 3
          done
          echo "Failed to push catalog after retries"
          exit 1
